# ghsingo P2 audio parity config (Issue #105).
#
# Every audio-relevant block ([audio] / [composer] / [mixer] / [assets.*] /
# [video].fps) is byte-for-byte the same values as src/rsghsing/rsghsing.toml,
# so the Go and Rust renders consume the same tuning. The extra blocks here
# ([video.background], [output.local]) exist only because Go's config validator
# requires them; rsghsing's validator does not, and they do not touch audio.
#
# Paths are absolute so both binaries work from any CWD and read the same
# daypack bytes and the same WAV assets. audio_parity.sh substitutes
# @@DAYPACK_DIR@@ before running.

[meta]
profile = "ambient"
engine  = "v2"

[archive]
source_dir   = "/home/zoomq/.herdr/worktrees/chao5whistler/run-105-p2/var/rsghsing/archive/raw"
daypack_dir  = "@@DAYPACK_DIR@@"
target_date  = "2026-03-28"

[archive.download]
enabled      = false
base_url     = "https://data.gharchive.org"
timeout_secs = 60
max_parallel = 4
user_agent   = "ghsingo/0.2"

[events]
types = ["PushEvent", "CreateEvent", "IssuesEvent", "PullRequestEvent", "ForkEvent", "ReleaseEvent"]
max_per_second = 4
dedupe_window_secs = 600

[events.weights]
PushEvent = 30
CreateEvent = 40
IssuesEvent = 50
PullRequestEvent = 70
ForkEvent = 80
ReleaseEvent = 100

[audio]
sample_rate = 44100
channels = 2
master_gain_db = 0.0

[composer]
ema_alpha             = 0.06
density_saturation    = 12.0
brightness_saturation = 80.0
phrase_ticks          = 16
accent_cooldown_ticks = 3
accent_base_prob      = 0.10
seed                  = 0

[mixer]
master_gain     = 0.55
drone_gain      = 1.0
bed_gain        = 1.0
tonal_bed_gain  = 0.575
accent_gain     = 1.0
wet_continuous  = 0.06
wet_accent      = 0.45
accent_max      = 4

[assets.tonal_bed]
wav_path = "/opt/src/41490/chao5whistler/ops/assets/sounds/ambient/tonal-bed.wav"
gain_db  = -4.8

[assets.accents]
bank_dir    = "/opt/src/41490/chao5whistler/ops/assets/sounds/bells/sampled"
synth_decay = 0.996

[video]
width = 1280
height = 720
fps = 15

[video.background]
mode = "solid"
switch_every_secs = 2.0
fade_secs = 0.2

[output]
mode = "local"
video_preset = "ultrafast"
audio_bitrate_kbps = 128

[output.local]
path = "/opt/logs/41490/out/rsghsing/p2/go/live.flv"
