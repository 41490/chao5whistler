[package]
name = "rsghsing"
version = "0.1.0"
edition = "2021"
description = "rsghsing — Rust rewrite of ghsingo (P1: prepare / GSIN daypack parity)"

# Single binary, subcommand dispatch. Later phases append subcommands to the
# Command enum in src/main.rs; no plugin/config indirection needed for that.
[[bin]]
name = "rsghsing"
path = "src/main.rs"

# Dependency whitelist (Issue #104): nothing else may appear here. The banned
# crates are an async HTTP client and the synth/audio-backend stack; both are
# absent by design, so this file never names them.
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
# default-features off keeps ureq on rustls (no OpenSSL/native-tls); the
# "gzip" feature is deliberately NOT enabled — GH Archive hour packs are
# application/x-gzip bodies that we inflate ourselves with flate2.
ureq = { version = "2", default-features = false, features = ["tls"] }
# Font rasterization for the P3 video path (Issue #106). Whitelisted small dep.
ab_glyph = "0.2"
