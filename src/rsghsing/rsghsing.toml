# rsghsing base profile (Issue #104).
#
# Same schema/semantics as src/ghsingo/ghsingo.toml, restricted to the
# sections P1 `prepare` reads. Unknown sections are ignored on load, so the
# audio/video/composer blocks can be added here when a later subcommand
# needs them.
#
# A sibling `rsghsing.local.toml` (gitignored) overlays ONLY the keys it
# mentions. Relative paths resolve against THIS FILE's directory, so
# `--config` works from any CWD.

[meta]
profile = "ambient"
engine  = "v2"

[archive]
source_dir   = "../../var/rsghsing/archive/raw"
daypack_dir  = "../../var/rsghsing/daypack"
target_date  = "yesterday"

[archive.download]
enabled      = false
base_url     = "https://data.gharchive.org"
timeout_secs = 60
max_parallel = 4
user_agent   = "rsghsing/0.1"

[events]
types = ["PushEvent", "CreateEvent", "IssuesEvent", "PullRequestEvent", "ForkEvent", "ReleaseEvent"]
max_per_second = 4
dedupe_window_secs = 600

[events.weights]
PushEvent = 30
CreateEvent = 40
IssuesEvent = 50
PullRequestEvent = 70
ForkEvent = 80
ReleaseEvent = 100

[audio]
sample_rate = 44100
channels = 2
master_gain_db = 0.0

# Composer (state-vector core, #30). Empty fields fall back to the defaults
# documented in internal/composer/composer.go.
[composer]
ema_alpha             = 0.06
density_saturation    = 12.0
brightness_saturation = 80.0
phrase_ticks          = 16
accent_cooldown_ticks = 3
accent_base_prob      = 0.10
seed                  = 0

# Mixer (long-lived bus model, #31 + #32). Linear gains in [0, 1].
[mixer]
master_gain     = 0.55
drone_gain      = 1.0
bed_gain        = 1.0
tonal_bed_gain  = 0.575    # -4.8 dB
accent_gain     = 1.0
wet_continuous  = 0.06
wet_accent      = 0.45
accent_max      = 4

# Assets (v2 ambient layer assignments, #32).
[assets.tonal_bed]
wav_path = "/opt/src/41490/chao5whistler/ops/assets/sounds/ambient/tonal-bed.wav"
gain_db  = -4.8

[assets.accents]
bank_dir    = "/opt/src/41490/chao5whistler/ops/assets/sounds/bells/sampled"
synth_decay = 0.996

[video]
# fps stays the audio/composer tick rate. The P3 segment VIDEO is a fixed
# 30fps (decision baseline #5), applied in `render segment`; it does not read
# this value. Visual params below mirror src/ghsingo/ghsingo.toml [video].
fps = 15
width = 1280
height = 720
font_path = "/opt/src/41490/chao5whistler/ops/assets/3270NerdFontMono-Condensed.ttf"
font_size_min = 14
font_size_max = 42

[video.palette]
background = "#002b36"
text = "#fdf6e3"

[video.motion]
speed_px_per_sec = 180.0
spawn_y_min = 0.50
spawn_y_max = 0.95

[video.text]
bottom_margin_px = 16
despawn_y_min = 0.18
despawn_y_max = 0.45
scale_grow_per_sec = 0.22
rotation_deg = 90.0

[video.event_colors]
PushEvent = "#268bd2"
CreateEvent = "#2aa198"
IssuesEvent = "#cb4b16"
PullRequestEvent = "#d33682"
ForkEvent = "#93a1a1"
ReleaseEvent = "#dc322f"

[output]
mode = "local"

[output.rtmps]
url = ""

# Reserved for the P2+ scheduler (decision baseline #1: UTC execution).
[schedule]
timezone = "UTC"

# Streamer (P4, Issue #107). The TARGET stays in [output] (mode + rtmps.url,
# overlay-only, never committed); this section is transport only.
#   segments_dir        root holding <YYYY-MM-DD>/seg-<idx>.ts, where the date
#                       is D-1 relative to the wall clock (the daypack date).
#                       Empty = must be passed as --segments-dir.
#   ffmpeg_path         PATH lookup by default.
#   chunk_bytes         pump write size; 256 KiB keeps syscalls rare.
#   missing_poll_secs   wait interval when a segment is not ready yet.
#                       We wait and warn, never skip (water level is P5's).
#   restart_backoff_max_secs  cap for the ffmpeg respawn backoff.
[stream]
segments_dir            = "../../var/rsghsing/stream/segments"
ffmpeg_path             = "ffmpeg"
chunk_bytes             = 262144
missing_poll_secs       = 1.0
restart_backoff_max_secs = 30.0
